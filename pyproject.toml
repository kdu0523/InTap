[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intap"
version = "0.1.0"
description = "Evidence-based engineering profiles and company-aware coding agents."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
schema = ["jsonschema[format-nongpl]>=4.23,<5"]
dev = ["jsonschema[format-nongpl]>=4.23,<5"]

[project.scripts]
intap = "intap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
